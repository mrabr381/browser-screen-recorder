<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Screen Recorder</title>
<style>
  body { width: 280px; margin: 0; padding: 16px; font-family: system-ui, sans-serif; color: #1f2937; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  p { font-size: 12px; color: #6b7280; margin: 0 0 12px; line-height: 1.5; }
  button { display: block; width: 100%; padding: 10px; margin-bottom: 8px; font-size: 13px;
           border: 0; border-radius: 8px; cursor: pointer; }
  .primary { background: #dc2626; color: #fff; font-weight: 600; }
  .primary:hover { background: #b91c1c; }
  .secondary { background: #f3f4f6; color: #1f2937; }
  .secondary:hover { background: #e5e7eb; }
  .note { font-size: 11px; color: #9ca3af; }
</style>
</head>
<body>
  <h1>● Screen Recorder</h1>
  <p>Free, local, no time limit. Recordings are saved to your Downloads folder — nothing is uploaded anywhere.</p>
  <button class="primary" id="open-recorder">Open recorder</button>
  <button class="secondary" id="open-app">Open transcript editor (local app)</button>
  <p class="note">The local app must be running: <code>streamlit run app.py</code> in the project folder, then it opens at localhost:8501.</p>
  <p class="note"><a href="https://github.com/mrabr381/browser-screen-recorder" target="_blank" rel="noopener">⭐ Star on GitHub</a> &nbsp;·&nbsp; <a href="https://www.buymeacoffee.com/muhammadabubakar" target="_blank" rel="noopener">☕ Buy me a coffee</a></p>
  <script src="popup.js"></script>
</body>
</html>
